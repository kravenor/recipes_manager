services:
  # --- INFRASTRUTTURA DNS E PROXY ---
  
  dnsmasq:
    image: jpillora/dnsmasq
    container_name: ricette-dnsmasq
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    environment:
      # Risponde a qualsiasi cosa .local con l'IP del tuo computer
      # Sostituisci 192.168.1.XX con il tuo IP locale reale
      - USER=root
      - HTTP_USER=admin
      - HTTP_PASS=admin
    command: ["-k", "--address=/.local/192.168.1.200"] 
    networks:
      - ricette-network

  traefik:
    image: traefik:v2.10
    container_name: ricette-traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080" # Dashboard Traefik
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - ricette-network

  mysql:
    image: mysql:8.0
    container_name: ricette-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ricette}
      MYSQL_USER: ${MYSQL_USER:-ricette}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ricette}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ricette-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: ricette-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - ricette-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # --- APPLICATION STACK (CON LABELS PER TRAEFIK) ---

  backend:
    build:
      context: ./backend/docker
      dockerfile: Dockerfile
    container_name: ricette-backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    networks:
      - ricette-network
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${MYSQL_DATABASE:-ricette}
      - DB_USERNAME=${MYSQL_USER:-ricette}
      - DB_PASSWORD=${MYSQL_PASSWORD:-ricette}
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200

  # Nginx for Backend
  nginx:
    image: nginx:alpine
    container_name: ricette-nginx
    restart: unless-stopped
    # Nota: puoi rimuovere il mapping porte "8000:80" perché ora passa tutto da Traefik sulla 80
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.ricette.local`)"
      - "traefik.http.routers.api.entrypoints=web"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/backend.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ricette-network
    depends_on:
      - backend

  frontend:
    image: node:20-alpine
    container_name: ricette-frontend
    restart: unless-stopped
    working_dir: /app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`ricette.local`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=5173"
    volumes:
      - ./frontend:/app
    command: ["sh", "-c", "npm install && npm run dev -- --host"]
    networks:
      - ricette-network
    environment:
      # Adesso puoi usare il dominio DNS anche qui!
      - VITE_API_URL=http://api.ricette.local/api

networks:
  ricette-network:
    driver: bridge

volumes:
  mysql_data:
  es_data: